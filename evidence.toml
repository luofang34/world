# Static architecture and structure gates for the world workspace.
# Run: cargo evidence gate --format=jsonl
schema_version = 1

[workspace]
name = "world"
exclude_paths = ["target/**"]

[architecture]
in_scope = [
    "world-core",
    "world-geomag",
    "world-atmosphere",
    "world-potential",
    "world-thermosphere",
    "world-airmass",
    "world-surveillance",
    "world-notices",
    "world",
]
no_out_of_scope_deps = true
require_all_crates_layered = true

# Tier 0: no_std, libm only (world-potential's `alloc` feature adds alloc).
[[architecture.layers]]
name = "tier0_core"
crates = ["world-core"]
allow_same_layer = false

[[architecture.layers]]
name = "tier0_models"
crates = ["world-geomag", "world-atmosphere", "world-potential"]
allow_same_layer = false

# Tier 0, one step up: the space environment may build on the seams of the
# models beneath it (an atmosphere model, a model's canonical content).
[[architecture.layers]]
name = "tier0_space_environment"
crates = ["world-thermosphere"]
allow_same_layer = false

# Tier 1: no_std + alloc moving world.
[[architecture.layers]]
name = "tier1_moving"
crates = ["world-airmass", "world-surveillance", "world-notices"]
allow_same_layer = false

[[architecture.layers]]
name = "umbrella"
crates = ["world"]
allow_same_layer = false

[[architecture.layers]]
name = "tooling"
crates = ["xtask"]
allow_same_layer = false

# Every no_std crate resolves, for the bare-metal and wasm targets CI builds, to
# libm and sibling world crates only.

[[architecture.dep_closures]]
id = "world-core-thumb"
package = "world-core"
target = "thumbv7em-none-eabihf"
features = []
forbid_crates = { serde = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", serde_json = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", sha2 = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", thiserror = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", anyhow = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", tokio = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", reqwest = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", hyper = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", rand = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", chrono = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", time = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", glam = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", nalgebra = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", tracing = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", log = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", once_cell = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", lazy_static = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", rayon = "no_std models depend on libm only; std-capable data-plane crates belong in a separate adapter", libc = "no_std models depend on libm only; std-capable data-plane crat
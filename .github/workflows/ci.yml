name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (default features)
        run: cargo test --workspace --all-targets
      - name: Test (all features)
        run: cargo test --workspace --all-targets --all-features
      - name: Doc
        env:
          RUSTDOCFLAGS: -D missing_docs -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --all-features --no-deps

  coefficients:
    name: WMM coefficients reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- check-wmm

  msis-parameters:
    name: NRLMSISE-00 parameters reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p xtask -- check-msis

  msrv:
    name: Minimum supported Rust (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The models that reach no domain library.
          - rust: 1.85.0
            packages: -p world-core -p world-geomag -p world-atmosphere -p world-potential -p world-thermosphere -p world-aloft -p world-notices -p xtask
          # The umbrella and the query layers build on the Surveillance and
          # Airmass cores and take their minimum from them.
          - rust: 1.88.0
            packages: --workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build ${{ matrix.packages }} --all-features

  no-std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The bare-metal target has no std, so a model that reaches for it
      # fails to build here rather than in firmware.
      - run: cargo build --release --target ${{ matrix.target }} -p world -p world-core -p world-geomag -p world-atmosphere -p world-potential -p world-propagation -p world-thermosphere
      - run: cargo build --release --target ${{ matrix.target }} -p world --features moving -p world-aloft -p world-traffic -p world-weather -p world-notices

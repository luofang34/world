[workspace]
resolver = "3"
members = [
    "crates/world",
    "crates/world-aloft",
    "crates/world-atmosphere",
    "crates/world-core",
    "crates/world-geomag",
    "crates/world-notices",
    "crates/world-potential",
    "crates/world-propagation",
    "crates/world-traffic",
    "crates/world-weather",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luofang34/world"

[workspace.dependencies]
world = { path = "crates/world", default-features = false }
world-aloft = { path = "crates/world-aloft" }
world-atmosphere = { path = "crates/world-atmosphere" }
world-core = { path = "crates/world-core" }
world-geomag = { path = "crates/world-geomag" }
world-notices = { path = "crates/world-notices" }
world-traffic = { path = "crates/world-traffic" }
world-weather = { path = "crates/world-weather" }
libm = "0.2"
thiserror = { version = "2.0", default-features = false }
# The dedicated domain libraries own traffic and weather state. Only their
# portable cores are named: the radio adapters and the repositories' root
# packages reach a private sibling checkout.
surveillance-core = { git = "https://github.com/luofang34/Surveillance", rev = "36b5d96052e817da92fc62d383196d11e449df10", default-features = false }
airmass-core = { git = "https://github.com/luofang34/Airmass", rev = "fbfec00b07b8bb34d44c951b0f98a33543487537", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"

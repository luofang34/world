[workspace]
resolver = "3"
members = [
    "crates/world",
    "crates/world-airmass",
    "crates/world-atmosphere",
    "crates/world-core",
    "crates/world-geomag",
    "crates/world-notices",
    "crates/world-surveillance",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luofang34/world"

[workspace.dependencies]
world = { path = "crates/world", default-features = false }
world-airmass = { path = "crates/world-airmass" }
world-atmosphere = { path = "crates/world-atmosphere" }
world-core = { path = "crates/world-core" }
world-geomag = { path = "crates/world-geomag" }
world-notices = { path = "crates/world-notices" }
world-surveillance = { path = "crates/world-surveillance" }
libm = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"

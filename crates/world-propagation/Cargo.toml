[package]
name = "world-propagation"
description = "Radio propagation loss models: ITU-R P.526 diffraction, NTIA ITM, ITU-R P.531 ionosphere, ITU-R P.618 slant-path attenuation, and reference/tabulated antenna patterns"
categories = ["no-std", "science"]
keywords = ["propagation", "diffraction", "itu-r", "antenna", "no-std"]
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# MSI/Planet and NSMA WG16.99 tabulated antenna pattern file readers
# (`no_std` + `alloc`). All propagation models remain allocation-free.
alloc = []

[dependencies]
world-core.workspace = true
# `core` has no f64 transcendentals on the embedded targets, and `libm`
# keeps native and wasm32 results bit-identical.
libm.workspace = true

[lints]
workspace = true

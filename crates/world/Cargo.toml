[package]
name = "world"
description = "Experimental prototype (not for navigation or flight): Earth environment models and the umbrella over the Surveillance and Airmass domain libraries"
edition.workspace = true
version.workspace = true
# Not the workspace value: this crate builds on the Surveillance and Airmass
# cores and cannot support an older toolchain than they declare.
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[features]
default = ["atmosphere", "geomag"]
atmosphere = ["dep:world-atmosphere"]
geomag = ["dep:world-geomag"]
aloft = ["dep:world-aloft", "atmosphere"]
airmass = ["dep:airmass-core", "dep:world-weather"]
surveillance = ["dep:surveillance-core", "dep:world-traffic"]
notices = ["dep:world-notices", "atmosphere"]
moving = ["airmass", "surveillance", "notices", "aloft", "dep:thiserror"]

[dependencies]
airmass-core = { workspace = true, optional = true }
surveillance-core = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
world-aloft = { workspace = true, optional = true }
world-atmosphere = { workspace = true, optional = true }
world-core = { workspace = true }
world-geomag = { workspace = true, optional = true }
world-notices = { workspace = true, optional = true }
world-traffic = { workspace = true, optional = true }
world-weather = { workspace = true, optional = true }

[lints]
workspace = true
